general:
  project: exp-0616
  run: shared-only-5B-1.5B-seed42
  seed: 42
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method: {std: 0.02}
  make_vocab_size_divisible_by: 1
  model_config:
    is_llama_config: true
    hidden_size: 2048
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 16
    intermediate_size: 5632
    vocab_size: 32000
    tie_word_embeddings: true
    hidden_act: silu
    max_position_embeddings: 2048
    rope_theta: 10000.0
    rope_interleaved: false
    rms_norm_eps: 1.0e-5
    attention_bias: false
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: null
    pretraining_tp: 1
    use_cache: false
tokenizer:
  tokenizer_name_or_path: /scratch/bvandur1/zhuicon1/tokenizers/llama2-unsloth-tokenizer
tokens:
  sequence_length: 2048
  # 1 EPOCH over the ~5B shared-only corpus (vs wrap's 3 epochs / 14305 over 10B).
  # corpus_tokens = sum(tokens-llama2 + 1) = 5,000,002,332 (VERIFIED by assemble_5B_shared_only.py
  #   copy+verify; matches source _manifest.json train_tokens_sum exactly).
  # train_steps = round(5,000,002,332 / 2,097,152) = 2384.
  # >>> Re-confirm against the tokenized .ds.metadata line-2 total after tokenize_arm.sh
  #     (expected 5,000,002,332 -> 2384); if it differs, recompute warmup/decay below. <<<
  train_steps: 2384
  micro_batch_size: 4
  batch_accumulation_per_replica: 64  # dp4: 4*4*64 = 1024 seq = 2,097,152 tok/step (global batch unchanged)
  val_check_interval: -1
  limit_val_batches: 0
  limit_test_batches: 0
parallelism:
  dp: 4
  tp: 1
  pp: 1
  expert_parallel_size: 1
  pp_engine: 1f1b
  tp_mode: REDUCE_SCATTER
  tp_linear_async_communication: true
data_stages:
- name: S0_shared_only_5B
  start_training_step: 1
  data:
    dataset:
      dataset_folder:
        - /scratch/bvandur1/zhuicon1/nanotron_tokenized/5B-shared-only/tokenized
    num_loading_workers: 1
    seed: 42
checkpoints:
  checkpoints_path: /scratch/bvandur1/zhuicon1/checkpoints/shared-only-5B-1.5B-seed42
  resume_checkpoint_path: /scratch/bvandur1/zhuicon1/checkpoints/_init_1.5B_seed42/0  # shared init (weights only)
  load_optimizer: false
  load_lr_scheduler: false
  checkpoint_interval: 100000  # > train_steps -> NO intermediate saves; only save_final_state writes the final 5B ckpt
  save_initial_state: false   # loads shared init via resume_checkpoint_path; does not regenerate
  save_final_state: true
optimizer:
  zero_stage: 0  # was 1; ZeRO-1 + accumulate_grad_in_fp32 is NotImplemented in nanotron 0.4 (fp32_accum_hook reduce_scatter path). zero_stage 0 keeps fp32 grad accumulation.
  weight_decay: 0.1
  clip_grad: 1.0
  accumulate_grad_in_fp32: true
  learning_rate_scheduler:
    # WSD (Warmup-Stable-Decay), SmolLM2-1.7B recipe shape. SCALED to this 1-epoch run by the
    # SAME PROPORTIONS as wrap/quality-base (warmup 3.5%, decay last 10%), not its absolute steps:
    #   lr_warmup_steps        = round(500/14305 * 2384)  = 83   (3.5% of train_steps)
    #   lr_decay_steps         = round(0.10 * 2384)        = 238  (last 10%)
    #   lr_decay_starting_step = 2384 - 238                = 2146 (90%)
    #   -> warmup 0->83 | stable 83->2146 (flat @ 5e-4) | decay 2146->2384 (linear -> 0)
    learning_rate: 5.0e-4
    lr_warmup_steps: 83
    lr_warmup_style: linear
    lr_decay_starting_step: 2146
    lr_decay_style: linear
    lr_decay_steps: 238
    min_decay_lr: 0.0
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    name: adamW
    torch_adam_is_fused: true
logging:
  iteration_step_info_interval: 1
