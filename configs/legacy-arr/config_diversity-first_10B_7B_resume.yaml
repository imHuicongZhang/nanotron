general:
  project: exp-0625
  run: diversity-first-10B-7B-1ep-seed42
  seed: 42
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method: {std: 0.02}
  make_vocab_size_divisible_by: 1
  model_config:
    is_llama_config: true
    hidden_size: 4096            # 7B (was 2048)
    num_hidden_layers: 32        # 7B (was 28)
    num_attention_heads: 32      # 7B (was 16)
    num_key_value_heads: 32      # 7B MHA, kv==heads (was 16)
    intermediate_size: 11008     # 7B (was 5632)
    vocab_size: 32000
    tie_word_embeddings: true     # kept = 1.5B choice
    hidden_act: silu
    max_position_embeddings: 2048
    rope_theta: 10000.0
    rope_interleaved: false
    rms_norm_eps: 1.0e-5
    attention_bias: false
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: null
    pretraining_tp: 1
    use_cache: false
tokenizer:
  tokenizer_name_or_path: /scratch/bvandur1/zhuicon1/tokenizers/llama2-unsloth-tokenizer
tokens:
  sequence_length: 2048
  train_steps: 4716   # 1 epoch: round(9,889,715,586 / 2,097,152) -- diversity has slightly fewer tokens
  micro_batch_size: 4
  batch_accumulation_per_replica: 256  # dp1/tp4: 4*256*1*2048 = 2,097,152 tok/step (global batch == 1.5B)
  val_check_interval: -1
  limit_val_batches: 0
  limit_test_batches: 0
parallelism:
  dp: 1                          # 7B: GPUs go to TP (was dp4)
  tp: 4                          # 7B: tensor-parallel across the 4 H100s (was tp1)
  pp: 1
  expert_parallel_size: 1
  pp_engine: 1f1b
  tp_mode: REDUCE_SCATTER
  tp_linear_async_communication: true
data_stages:
- name: S0_diversity_first_10B
  start_training_step: 1
  data:
    dataset:
      dataset_folder:
        - /scratch/bvandur1/zhuicon1/nanotron_tokenized_7B/diversity-first/tokenized
    num_loading_workers: 1
    seed: 42
checkpoints:
  checkpoints_path: /scratch/bvandur1/zhuicon1/checkpoints/diversity-first-10B-7B-1ep-seed42
  resume_checkpoint_path: /scratch/bvandur1/zhuicon1/checkpoints/diversity-first-10B-7B-1ep-seed42  # auto-resume from own latest.txt
  load_optimizer: true
  load_lr_scheduler: true
  checkpoint_interval: 477  # ~1B tokens: 477 * 2,097,152 = 1.0003B
  save_initial_state: false   # resume run: do not rewrite step-0
  save_final_state: true
optimizer:
  zero_stage: 0  # dp1 -> nothing to shard; ZeRO-1 + accumulate_grad_in_fp32 is NotImplemented in this nanotron
  weight_decay: 0.1
  clip_grad: 1.0
  accumulate_grad_in_fp32: true
  learning_rate_scheduler:
    # WSD, same proportions as 1.5B, train_steps=4716 (1 epoch):
    #   warmup 0->165 (3.5%) | stable 165->4244 (flat @ 3e-4) | decay 4244->4716 (linear -> 0, last 10%)
    learning_rate: 3.0e-4
    lr_warmup_steps: 165
    lr_warmup_style: linear
    lr_decay_starting_step: 4244
    lr_decay_style: linear
    lr_decay_steps: 472
    min_decay_lr: 0.0
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    name: adamW
    torch_adam_is_fused: true
logging:
  iteration_step_info_interval: 1
