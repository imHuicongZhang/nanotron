general:
  project: exp-0626
  run: _init_1.5B_seed43_gen
  seed: 43
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method: {std: 0.02}
  make_vocab_size_divisible_by: 1
  model_config:
    is_llama_config: true
    hidden_size: 2048
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 16
    intermediate_size: 5632
    vocab_size: 32000
    tie_word_embeddings: true
    hidden_act: silu
    max_position_embeddings: 2048
    rope_theta: 10000.0
    rope_interleaved: false
    rms_norm_eps: 1.0e-5
    attention_bias: false
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: null
    pretraining_tp: 1
    use_cache: false
tokenizer:
  tokenizer_name_or_path: /scratch/bvandur1/zhuicon1/tokenizers/llama2-unsloth-tokenizer
tokens:
  sequence_length: 2048
  train_steps: 1   # only need the step-0 initial state; exits immediately after
  micro_batch_size: 4
  batch_accumulation_per_replica: 64  # dp4/tp1 -> identical init layout to seed-42 init
  val_check_interval: -1
  limit_val_batches: 0
  limit_test_batches: 0
parallelism:
  dp: 4
  tp: 1
  pp: 1
  expert_parallel_size: 1
  pp_engine: 1f1b
  tp_mode: REDUCE_SCATTER
  tp_linear_async_communication: true
data_stages:
- name: S0_init
  start_training_step: 1
  data:
    dataset:
      dataset_folder:
        - /scratch/bvandur1/zhuicon1/nanotron_tokenized_7B/quality-base/tokenized
    num_loading_workers: 1
    seed: 43
checkpoints:
  checkpoints_path: /scratch/bvandur1/zhuicon1/checkpoints/_init_1.5B_seed43   # writes _init_1.5B_seed43/0
  checkpoint_interval: 1000000
  save_initial_state: true    # RandomInit(seed 43) -> save step 0/ = the shared seed-43 init
  save_final_state: false
optimizer:
  zero_stage: 0
  weight_decay: 0.1
  clip_grad: 1.0
  accumulate_grad_in_fp32: true
  learning_rate_scheduler:
    learning_rate: 5.0e-4
    lr_warmup_steps: 0
    lr_warmup_style: linear
    lr_decay_starting_step: 1
    lr_decay_style: linear
    lr_decay_steps: 0
    min_decay_lr: 0.0
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    name: adamW
    torch_adam_is_fused: true
logging:
  iteration_step_info_interval: 1
