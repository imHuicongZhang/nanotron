[project]
name = "nanotron"
version = "0.4"
description = "Minimalistic Large Language Model Training and Finetuning"
authors = [
    {name = "Nouamane Tazi", email="nouamane@huggingface.co"},
    {name = "Thomas Wang", email="thomas.wang@huggingface.co"},
    {name = "Kunhao Zheng", email="kunhao@huggingface.co"},
    {name = "Thomas Wolf", email="thomas@huggingface.co"},
]
readme = "README.md"
requires-python = "~=3.10"
classifiers = [
    "Topic :: Software Development"
]
dependencies = [
    # PATCH #7 (2026-08-09, Blackwell stack). torch>=2.7 is the first release whose cu128 wheels
    # carry sm_100 SASS; 2.4.1+cu124 stops at sm_90 and ships no PTX, so it cannot run on
    # Blackwell at all. numpy<2 was already stale and inconsistent with this project's own
    # `nanosets` extra — datatrove >=0.4 requires numpy>=2; <2.1 keeps numba 0.60 happy.
    "torch>=2.7.0",
    "pyyaml",
    "numpy>=2.0,<2.1",
    "packaging",
    "safetensors",
    "dacite",
    "tqdm",
    "datasets",
    "torchtyping"
]

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)

[tool.ruff]
line-length = 119
ignore = ["C901","E501"] # E501 ignores length violation handled by black
select = ["C","E","F","I","W"]
ignore-init-module-imports = true

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pylint"
]

test = [
    "pytest",
    "pytest-xdist"
]

fast-modeling = [
    # PATCH #7 (2026-08-09, Blackwell stack). The old `<2.7.0` cap excludes every build that can
    # emit sm_100: flash-attn's setup.py only gained `arch=compute_100,code=sm_100` at 2.7+, and
    # gates it on CUDA >=12.8. 2.8.x also changed `bert_padding.unpad_input` from a 4- to a
    # 5-tuple, which patch #6 in models/llama.py absorbs.
    "flash-attn>=2.8.0",
]

nanosets = [
     "transformers",
     "datatrove[io,processing]@git+https://github.com/huggingface/datatrove",
     "numba",
]

s3 = [
    "boto3",
    "s3fs",
    "s5cmd",
]

[build-system]
requires = [
    "setuptools",
]

[pytest]
norecursedirs="tests/helpers"
